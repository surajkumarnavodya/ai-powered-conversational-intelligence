<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- This app (including any /shared/:ref conversation-sharing page) is
         never meant to be publicly search-indexed -- see SECURITY.md's
         conversation-sharing section. A single global tag, since this is a
         client-rendered SPA with one static <head> for every route. -->
    <meta name="robots" content="noindex, nofollow" />
    <title>AI-Powered Conversational Intelligence</title>

    <!-- PWA installability. vite-plugin-pwa injects the manifest link and
         registers the service worker automatically at build time; the
         tags below are the ones it does NOT add for you -- iOS Safari has
         no manifest-driven "Add to Home Screen" theming, so it reads these
         directly instead. -->
    <meta name="theme-color" content="#4f46e5" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Text-to-SQL" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- No web-font <link> here on purpose. The selectable fonts
         (src/lib/fonts.ts) are self-hosted via @fontsource-variable and
         lazy-loaded by the picker, so this app makes no third-party request
         to render its own UI and works unchanged in an air-gapped
         deployment -- the same local-first posture as the LLM, database and
         vector store. This previously pulled four families from the Google
         Fonts CDN on every page load, whether or not they were selected. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
