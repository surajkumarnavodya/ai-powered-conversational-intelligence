[project]
name = "text-to-sql-dashboard"
version = "0.1.0"
description = "Text-to-SQL Gen AI dashboard, connected to your own database (Ollama + LangGraph + ChromaDB + SQLAlchemy + FastAPI + React)."
requires-python = ">=3.11"

[tool.black]
line-length = 100
target-version = ["py311"]
# Applied Alembic revisions are excluded from formatting, and the reason is
# CLAUDE.md 12: "never hand-edit an applied revision; add a new one." A
# formatter that rewrites one is doing exactly that. The conflict was not
# hypothetical -- `black --check .` under the pinned 26.3.1 wanted to
# reformat `9c7ccf95397a_initial_identity_schema.py`, so the repo could
# satisfy the format gate or that rule, not both.
#
# Safe to exclude: these files are generated by Alembic, are never edited
# by hand once applied, and are read by
# `tests/test_identity_schema_invariants.py` as *text* (it parses
# `create_table` calls out of them), which is one more reason not to let a
# formatter move their contents around.
#
# `force-exclude` rather than `extend-exclude`: the latter is ignored when
# a path is passed explicitly, so `black identity/migrations/...` would
# still rewrite it.
force-exclude = 'identity/migrations/versions/.*\.py'

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["agent", "api", "config", "db", "embeddings", "eval", "media_gen", "scripts", "security", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "E501",  # line length is enforced by black, not ruff
]

[tool.ruff.lint.isort]
known-first-party = ["agent", "api", "attachments", "config", "db", "embeddings", "eval", "feedback", "media_gen", "observability", "rag", "scripts", "search", "security"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection convention requires calling File()/Form()
# as an argument default -- these are singleton marker objects FastAPI
# itself inspects at request time, not the mutable-default-argument
# footgun B008 actually guards against. `fastapi.Depends` and
# `api.authz.require_permission` (2026 Phase 2: a parameterized
# dependency *factory*, FastAPI's own documented "parameterized
# dependencies" pattern -- `Depends(require_permission(Permission.X))`
# builds one closure once, at route-registration/import time, not per
# request) are the same shape of safe, intentional call-in-default.
# `fastapi.Query` (Prompt 49, found while adding `api/workflow.py`'s own
# `recommendation_id: uuid.UUID | None = Query(default=None)` query
# param): ruff's bugbear check already special-cases `Query(default=...)`
# for plain `str`/`bool`-typed params (every pre-existing route's own
# `Query()` usage in this codebase is one of those, which is why this
# gap went unnoticed until a `uuid.UUID | None`-typed one was added) but
# not for a `uuid.UUID`-typed one -- reproduced directly against a
# minimal two-line example, confirmed a ruff/bugbear false positive for
# this exact type, not something special about this route.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Query",
    "api.authz.require_permission",
]

[tool.bandit]
# Single-sourced so a local run and the CI gate scan the same files -- the
# reason this block exists at all (2026-10-29, UAT-readiness Phase 8,
# `BP-005`). The gate used to name twelve packages on the command line
# (`bandit -r agent api config db security media_gen moderation rag search
# voice media embeddings`) and therefore never looked at `identity/`,
# `governance/`, `governance_center/`, `guardrails/`, `jobs/`,
# `attachments/`, `mcp_client/`, `onboarding/`, `semantic/`, `analytics/`
# or twenty-odd others. Measured: 24 findings lived in that blind spot,
# six of them in `identity/` -- the authentication package. A path list
# on a command line is a list somebody has to remember to extend; an
# exclude list is not.
#
# `tests/` is excluded because pytest's own `assert` is the point of a
# test file, so B101 there is noise rather than signal -- the standard
# exclusion, and the only one that drops first-party code.
exclude_dirs = [
    "tests",
    ".venv",
    "env",
    "node_modules",
    "frontend",
    ".claude",
    ".git",
    "media_library",
    "embeddings/.chroma",
]

[tool.mypy]
# Deliberately not pinned to 3.11 (the project's nominal target, see
# requires-python above): this machine's venv runs 3.14 (see CLAUDE.md's
# Python-version note), and pinning to 3.11 here makes mypy parse installed
# stubs (e.g. numpy's) using 3.11 grammar even though they were built for
# 3.14, which errors out immediately. Leaving this unset makes mypy infer
# the version from the interpreter actually running it.
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
exclude = ["\\.venv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Live integration tests are opt-in and deselected by default, so the
# ordinary suite stays fully mocked (CLAUDE.md 7: no real database, no
# Ollama, no network). Run them explicitly with `-m live` once the
# relevant credentials are present -- see
# docs/LIVE_INTEGRATION_TESTING.md.
addopts = "-m 'not live'"
markers = [
  "live: requires real credentials and external infrastructure; opt-in via `-m live`",
]
